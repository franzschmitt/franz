<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Local Sell App</title><style>:root{--g:#1f6f3d;--bg:#f4f6f5;--line:#dfe6e1;--muted:#68756d}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#172019}header{background:var(--g);color:white;padding:18px 16px;position:sticky;top:0}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:25px;font-weight:900}.sub{font-size:12px;opacity:.9}.actions{display:flex;gap:8px}button{border:0;border-radius:10px;padding:10px 12px;font-weight:700}.headbtn{background:white;color:var(--g)}main{padding:14px;max-width:900px;margin:auto}.hero{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}.hero h1{margin:0 0 7px}.hero p{margin:0 0 14px;color:var(--muted)}input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;margin:5px 0;font-size:15px}.cats{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.cats button{white-space:nowrap;background:white;border:1px solid var(--line)}.cats .on{background:var(--g);color:white}.section{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden}.pic{height:105px;background:#edf2ee;display:flex;align-items:center;justify-content:center;font-size:43px}.body{padding:11px}.body h3{font-size:15px;margin:0 0 5px}.part{font-size:12px;color:var(--muted)}.price{font-size:19px;font-weight:900;margin:10px 0}.primary{width:100%;background:var(--g);color:white}.secondary{background:white;color:var(--g);border:1px solid var(--line)}.danger{width:100%;background:#a93636;color:white;margin-top:8px}.overlay{position:fixed;inset:0;background:#0008;display:flex;justify-content:flex-end;z-index:20}.hidden{display:none}.panel{width:min(430px,100%);height:100%;background:white;padding:16px;overflow:auto}.panelhead{display:flex;justify-content:space-between;align-items:center}.cartrow{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);padding:12px 0}.qty{display:flex;gap:5px;align-items:center}.total{font-size:20px;margin:15px 0}.empty{padding:24px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);padding:25px;font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}</style></head><body><header><div class="top"><div><div class="brand">LOCAL SELL</div><div class="sub" id="tag">Buy and sell locally</div></div><div class="actions"><button class="headbtn" id="lang">ES</button><button class="headbtn" id="cartOpen">🛒 <span id="count">0</span></button></div></div></header><main><section class="hero"><h1 id="hero">Find what you need</h1><p id="intro">Browse local products and send your order directly by WhatsApp.</p><input id="search" placeholder="Search name or part number"></section><div class="cats" id="cats"></div><div class="section"><h2 id="prodTitle">Products</h2><button class="secondary" id="adminOpen">Admin</button></div><div class="grid" id="grid"></div></main><footer>Local Sell App</footer><div class="overlay hidden" id="cart"><div class="panel"><div class="panelhead"><h2 id="cartTitle">Your Cart</h2><button id="cartClose">✕</button></div><div id="cartRows"></div><div class="total"><span id="totalText">Total</span>: <strong id="total">$0</strong></div><input id="cust" placeholder="Your name"><input id="place" placeholder="Town / location"><button class="primary" id="wa">Order on WhatsApp</button><button class="danger" id="clear">Clear cart</button></div></div><div class="overlay hidden" id="admin"><div class="panel"><div class="panelhead"><h2 id="adminTitle">Admin</h2><button id="adminClose">✕</button></div><p id="note">Add products here. They stay saved on this phone.</p><input id="pn" placeholder="Product name"><input id="pp" placeholder="Part number"><input id="price" type="number" step="0.01" placeholder="Price"><select id="cat"><option>Filters</option><option>Bearings</option><option>Tractor Parts</option><option>Oils</option><option>Other</option></select><button class="primary" id="add">Add Product</button><button class="secondary" style="width:100%;margin-top:8px" id="reset">Reset demo products</button></div></div><script>const PHONE='529831307774';const demo=[{id:1,n:'Baldwin B76 Oil Filter',p:'B76',x:241,c:'Filters'},{id:2,n:'Baldwin BT339 Filter',p:'BT339',x:320,c:'Filters'},{id:3,n:'Timken Bearing Set',p:'67048/10',x:520,c:'Bearings'},{id:4,n:'Taper Roller Bearing',p:'48548/10',x:105,c:'Bearings'},{id:5,n:'Tractor Hydraulic Filter',p:'GP-84',x:395,c:'Tractor Parts'},{id:6,n:'15W-40 Engine Oil',p:'15W40',x:890,c:'Oils'}];let products=JSON.parse(localStorage.getItem('ls_products')||'null')||demo,cart=JSON.parse(localStorage.getItem('ls_cart')||'[]'),lang=localStorage.getItem('ls_lang')||'en',active='All';const T={en:{tag:'Buy and sell locally',hero:'Find what you need',intro:'Browse local products and send your order directly by WhatsApp.',search:'Search name or part number',products:'Products',admin:'Admin',cart:'Your Cart',total:'Total',name:'Your name',place:'Town / location',order:'Order on WhatsApp',clear:'Clear cart',note:'Add products here. They stay saved on this phone.',add:'Add Product',reset:'Reset demo products',all:'All',toCart:'Add to cart',empty:'Your cart is empty.'},es:{tag:'Compra y vende localmente',hero:'Encuentra lo que necesitas',intro:'Busca productos locales y envía tu pedido directamente por WhatsApp.',search:'Buscar nombre o número de parte',products:'Productos',admin:'Administrar',cart:'Tu carrito',total:'Total',name:'Tu nombre',place:'Ciudad / ubicación',order:'Pedir por WhatsApp',clear:'Vaciar carrito',note:'Agrega productos aquí. Se guardan en este teléfono.',add:'Agregar producto',reset:'Restablecer productos',all:'Todos',toCart:'Agregar',empty:'Tu carrito está vacío.'}};const $=x=>document.getElementById(x),tr=k=>T[lang][k],money=n=>'$'+Number(n).toLocaleString('en-US',{maximumFractionDigits:2});function save(){localStorage.setItem('ls_products',JSON.stringify(products));localStorage.setItem('ls_cart',JSON.stringify(cart))}function drawCats(){let a=['All',...new Set(products.map(p=>p.c))];$('cats').innerHTML='';a.forEach(c=>{let b=document.createElement('button');b.textContent=c==='All'?tr('all'):c;b.className=c===active?'on':'';b.onclick=()=>{active=c;drawCats();render()};$('cats').appendChild(b)})}function render(){let q=$('search').value.toLowerCase();let a=products.filter(p=>(active==='All'||p.c===active)&&(p.n+' '+p.p).toLowerCase().includes(q));$('grid').innerHTML=a.map(p=>`<div class="card"><div class="pic">🛍️</div><div class="body"><h3>${p.n}</h3><div class="part">${p.p} • ${p.c}</div><div class="price">${money(p.x)}</div><button class="primary" onclick="addCart(${p.id})">${tr('toCart')}</button></div></div>`).join('')||'<div class="empty">No products found.</div>'}window.addCart=id=>{let z=cart.find(i=>i.id===id);z?z.q++:cart.push({id,q:1});save();drawCart()};window.qty=(id,d)=>{let z=cart.find(i=>i.id===id);if(!z)return;z.q+=d;if(z.q<1)cart=cart.filter(i=>i.id!==id);save();drawCart()};function drawCart(){let total=0;$('count').textContent=cart.reduce((a,b)=>a+b.q,0);$('cartRows').innerHTML=cart.length?cart.map(i=>{let p=products.find(x=>x.id===i.id);if(!p)return'';total+=p.x*i.q;return`<div class="cartrow"><div><strong>${p.n}</strong><div class="part">${p.p}</div>${money(p.x)} × ${i.q}</div><div class="qty"><button onclick="qty(${i.id},-1)">−</button><b>${i.q}</b><button onclick="qty(${i.id},1)">+</button></div></div>`}).join(''):`<div class="empty">${tr('empty')}</div>`;$('total').textContent=money(total)}function apply(){$('lang').textContent=lang==='en'?'ES':'EN';$('tag').textContent=tr('tag');$('hero').textContent=tr('hero');$('intro').textContent=tr('intro');$('search').placeholder=tr('search');$('prodTitle').textContent=tr('products');$('adminOpen').textContent=tr('admin');$('cartTitle').textContent=tr('cart');$('totalText').textContent=tr('total');$('cust').placeholder=tr('name');$('place').placeholder=tr('place');$('wa').textContent=tr('order');$('clear').textContent=tr('clear');$('adminTitle').textContent=tr('admin');$('note').textContent=tr('note');$('add').textContent=tr('add');$('reset').textContent=tr('reset');drawCats();render();drawCart()}$('search').oninput=render;$('lang').onclick=()=>{lang=lang==='en'?'es':'en';localStorage.setItem('ls_lang',lang);apply()};$('cartOpen').onclick=()=>$('cart').classList.remove('hidden');$('cartClose').onclick=()=>$('cart').classList.add('hidden');$('adminOpen').onclick=()=>$('admin').classList.remove('hidden');$('adminClose').onclick=()=>$('admin').classList.add('hidden');$('clear').onclick=()=>{cart=[];save();drawCart()};$('add').onclick=()=>{let n=$('pn').value.trim(),p=$('pp').value.trim(),x=parseFloat($('price').value),c=$('cat').value;if(!n||!p||!x){alert('Name, part number and price are required.');return}products.push({id:Date.now(),n,p,x,c});save();$('pn').value='';$('pp').value='';$('price').value='';drawCats();render()};$('reset').onclick=()=>{products=JSON.parse(JSON.stringify(demo));cart=[];save();apply()};$('wa').onclick=()=>{if(!cart.length){alert(tr('empty'));return}let total=0,lines=cart.map(i=>{let p=products.find(x=>x.id===i.id),s=p.x*i.q;total+=s;return`• ${p.n} (${p.p}) x${i.q} = ${money(s)}`});let msg=lang==='en'?`Hello, I would like to order:\n\n${lines.join('\n')}\n\nTotal: ${money(total)}\nName: ${$('cust').value||'-'}\nLocation: ${$('place').value||'-'}`:`Hola, quiero pedir:\n\n${lines.join('\n')}\n\nTotal: ${money(total)}\nNombre: ${$('cust').value||'-'}\nUbicación: ${$('place').value||'-'}`;location.href=`https://wa.me/${PHONE}?text=${encodeURIComponent(msg)}`};apply();</script></body></html>
